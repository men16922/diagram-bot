[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diagram-bot"
version = "0.1.0"
description = "AWS configuration inventory and evidence-based topology"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["boto3>=1.35,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
diagram-bot = "diagram_bot.cli:main"

[tool.setuptools.package-data]
diagram_bot = ["viewer.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
