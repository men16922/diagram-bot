[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diagram-bot"
version = "0.2.0"
description = "AWS configuration inventory and evidence-based topology"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["boto3>=1.35,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "defusedxml>=0.7,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
browser = ["playwright>=1.50,<2", "pillow>=11,<13"]

[project.scripts]
diagram-bot = "diagram_bot.cli:main"

[tool.setuptools.package-data]
diagram_bot = ["viewer.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
