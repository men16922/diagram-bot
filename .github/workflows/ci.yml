name: Tests and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tools
        run: python -m pip install build
      # Test dependencies come from the package's [test] extra so CI never drifts from pyproject.toml.
      - name: Build distribution and install wheel with test extras
        run: |
          python -m build
          python -m pip install "$(ls dist/*.whl)[test]"
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Test AWS collection and graph generation
        run: python -m pytest -q
      - name: Verify packaged viewer and CLI without AWS credentials
        run: |
          diagram-bot demo --output "$RUNNER_TEMP/diagram-bot-demo"
          diagram-bot render "$RUNNER_TEMP/diagram-bot-demo/snapshot.json" --output "$RUNNER_TEMP/diagram-bot-rendered"
          diagram-bot review "$RUNNER_TEMP/diagram-bot-demo/snapshot.json" --format json > /dev/null
          diagram-bot demo --sample three-tier --output "$RUNNER_TEMP/three-tier"
          diagram-bot review "$RUNNER_TEMP/three-tier/snapshot.json" --fail-on medium
          diagram-bot diff "$RUNNER_TEMP/diagram-bot-demo/snapshot.json" "$RUNNER_TEMP/diagram-bot-rendered/snapshot.json" --fail-on-change

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install app and Chromium
        run: |
          python -m pip install '.[browser]'
          python -m playwright install --with-deps chromium
          diagram-bot setup-editor
      - name: Verify native editing and file downloads
        run: |
          diagram-bot serve --data-dir "$RUNNER_TEMP/diagram-bot-browser" > "$RUNNER_TEMP/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8765/api/bootstrap > /dev/null && break
            sleep 1
          done
          python scripts/verify_demo.py
      - name: Verify team mode (TLS, sign-in, roles, audit)
        run: python scripts/verify_team.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: browser-demo
          path: artifacts/browser/
